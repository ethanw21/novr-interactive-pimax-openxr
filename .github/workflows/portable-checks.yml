name: Portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # Only source required by these suites: no Unity/game/native binaries.
          sparse-checkout: |
            /NOVR/
            /tests/
            /tools/
            /native/foveation/
            /NOVR.Installer/InstallerConstants.cs
            /NOVR.Installer/InstallType.cs
            /NOVR.Installer/Models/
            /NOVR.Installer/Services/
            /NOVR.Installer/ViewModels/
            /NOVR.XR.OpenXR/Compatibility/NovrEyeTextureRequests.cs
            /NOVR.XR.OpenXR/Settings/NovrControllerProfiles.cs
            /NOVR.XR.OpenXR/input/NovrEyeGaze.cs
            /NOVR.Patcher/PayloadFile.cs
            /NOVR.Patcher/ManagedPayloadUpgrade.cs
            /NOVR.Patcher/StartupHandoff.cs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test verification runner
        run: python -m unittest discover -s tools/verification -p "test_*.py"
      - name: Verify source-only suites
        run: python tools/verify.py portable
      - name: Verify native foveation pattern and query lifecycle
        if: runner.os == 'Linux'
        run: bash native/foveation/check.sh
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-checks-${{ matrix.os }}
          path: artifacts/verification/portable/
          if-no-files-found: warn
          retention-days: 14

  package-safety:
    name: Package safety (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # Build tasks and synthetic fixtures only; no runtime build or binaries.
          sparse-checkout: |
            /tests/Installer/check_build.py
            /NOVR.Build/NOVR.Build.csproj
            /NOVR.Build/NOVR.Build.props
            /NOVR.Build/NOVR.Build.targets
            /NOVR.Build/NOVR.Sources.props
            /NOVR.Build/ValidatePackageVersion.cs
            /NOVR.Build/Tasks/NOVR.Build.Tasks.csproj
            /NOVR.Build/Tasks/Directory.Build.props
            /NOVR.Build/Tasks/Directory.Build.targets
            /NOVR/NOVRPlugin.cs
            /NOVR/NOVR.csproj
            /NOVR.Patcher/NOVR.Patcher.csproj
            /NOVR.Installer/NOVR.Installer.csproj
            /README.md
            /LICENSE
            /docs/THIRD_PARTY_NOTICES.md
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify deployment, installer publication and release package safety
        run: python tests/Installer/check_build.py
